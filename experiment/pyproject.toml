[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnp-network-architecture"
version = "0.1.0"
description = "Adversarial instruments for architecture-relative computational lifecycle cost"
requires-python = ">=3.10"

[project.scripts]
pnp-attack = "pnp_architecture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
